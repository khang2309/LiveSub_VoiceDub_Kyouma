[package]
name = "livesub-desktop"
version = "1.0.0"
description = "LiveSub & VoiceDub AI Desktop Studio"
authors = ["LiveSub Team"]
license = "MIT"
edition = "2021"

[lib]
name = "livesub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
livesub-app = { path = "../rust/livesub-app" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
