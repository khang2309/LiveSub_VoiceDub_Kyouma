[package]
name = "ocr-engine-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "High-performance multilingual OCR engine in Rust (VI, JA, ZH, TH, EN)"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hashbrown = "0.15"
regex = "1"

