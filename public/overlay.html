<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveSub Subtitles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #f1f5f9;
      user-select: none;
      cursor: move;
    }
    body.pure-transparent {
      background: rgba(0, 0, 0, 0.15) !important;
    }
    body.dark-mode {
      background: rgba(10, 14, 23, 0.8) !important;
    }
    .overlay-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 2px 10px;
      text-align: center;
    }
    .sub-source {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
      max-width: 98%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
      text-shadow: 0 1px 3px #000, 0 0 6px #000;
    }
    .sub-vi {
      font-size: 21px;
      font-weight: 800;
      color: #facc15;
      line-height: 1.2;
      max-width: 98%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-text-stroke: 1.2px #000;
      text-shadow: 0 2px 6px #000, 0 0 12px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body id="overlayBody" title="Bấm vào đây để chuyển đổi độ trong suốt">
  <div class="overlay-container">
    <div id="floatSource" class="sub-source"></div>
    <div id="floatVi" class="sub-vi">Đang chờ âm thanh hoặc video...</div>
  </div>

  <script>
    const floatSource = document.getElementById('floatSource');
    const floatVi = document.getElementById('floatVi');
    const body = document.getElementById('overlayBody');

    // Click anywhere to cycle transparency modes
    let modeIdx = 0;
    const modes = ['', 'pure-transparent', 'dark-mode'];
    body.addEventListener('click', () => {
      modeIdx = (modeIdx + 1) % modes.length;
      body.className = modes[modeIdx];
    });

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'UPDATE_SUBTITLE') {
        const { sourceText, viText, subMode } = e.data;
        floatSource.textContent = sourceText || '';
        floatVi.textContent = viText || '';

        if (subMode === 'vi_only') {
          floatSource.style.display = 'none';
          floatVi.style.display = 'block';
        } else if (subMode === 'source_only') {
          floatSource.style.display = 'block';
          floatVi.style.display = 'none';
        } else if (subMode === 'none') {
          floatSource.style.display = 'none';
          floatVi.style.display = 'none';
        } else {
          floatSource.style.display = sourceText ? 'block' : 'none';
          floatVi.style.display = 'block';
        }
      } else if (e.data.type === 'SET_TRANSPARENCY') {
        if (e.data.mode === 'transparent') {
          body.className = 'pure-transparent';
        } else if (e.data.mode === 'glass') {
          body.className = '';
        } else {
          body.className = 'dark-mode';
        }
      }
    });
  </script>
</body>
</html>
