<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cửa sổ phụ đề nổi của LiveSub và VoiceDub AI.">
  <title>LiveSub Subtitles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Hallmark · shape: app overlay · genre: atmospheric · theme: Spore · redesign: full · scope: app */
    :root {
      --overlay-paper: oklch(8% 0.008 60 / 0.72);
      --overlay-paper-soft: oklch(8% 0.008 60 / 0.35);
      --overlay-paper-strong: oklch(15% 0.012 60 / 0.88);
      --overlay-ink: #FFFFFF;
      --overlay-ink-muted: rgba(255, 255, 255, 0.82);
      --overlay-accent: #FFFFFF;
      --overlay-shadow: #000000;
      --overlay-font-sub: "Roboto Condensed", "Oswald", "Barlow Condensed", "Montserrat", "Arial Narrow", "Franklin Gothic Medium", sans-serif;
      --overlay-font: var(--overlay-font-sub);
      --space-3xs: 2px;
      --space-sm: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: clip;
      overflow-y: hidden;
      background: var(--overlay-paper) !important;
      font-family: var(--overlay-font);
      color: var(--overlay-ink);
      user-select: none;
      cursor: move;
    }
    body.pure-transparent {
      background: var(--overlay-paper-soft) !important;
    }
    body.dark-mode {
      background: var(--overlay-paper-strong) !important;
    }
    body:focus-visible {
      outline: 2px solid var(--overlay-accent);
      outline-offset: -4px;
    }
    body:active {
      opacity: 0.88;
    }
    .overlay-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: var(--space-3xs) var(--space-sm);
      text-align: center;
    }
    .sub-source {
      font-family: var(--overlay-font-sub);
      font-size: 13px;
      color: var(--overlay-ink-muted);
      font-weight: 600;
      max-width: 98%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
      -webkit-text-stroke: 1px #000000;
      paint-order: stroke fill;
      text-shadow: 0 1px 3px #000000;
      letter-spacing: 0.01em;
    }
    .sub-vi {
      font-family: var(--overlay-font-sub);
      font-size: 24px;
      font-weight: 800;
      font-size-adjust: from-font;
      color: #FFFFFF;
      line-height: 1.25;
      max-width: 98%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-text-stroke: 1.8px #000000;
      paint-order: stroke fill;
      text-shadow:
        -2px -2px 0 #000000,
         2px -2px 0 #000000,
        -2px  2px 0 #000000,
         2px  2px 0 #000000,
         0px  3px 8px rgba(0, 0, 0, 0.9);
      background: rgba(15, 23, 42, 0.88);
      border-radius: 8px;
      padding: 4px 16px;
      display: inline-block;
      letter-spacing: 0.015em;
    }
  </style>
</head>
<body id="overlayBody" tabindex="0" role="button" aria-label="Chuyển chế độ nền phụ đề" title="Bấm vào đây để chuyển đổi độ trong suốt">
  <div class="overlay-container">
    <div id="floatSource" class="sub-source"></div>
    <div id="floatVi" class="sub-vi">Đang chờ âm thanh hoặc video…</div>
  </div>

  <script>
    const floatSource = document.getElementById('floatSource');
    const floatVi = document.getElementById('floatVi');
    const body = document.getElementById('overlayBody');

    // Click anywhere to cycle transparency modes
    let modeIdx = 0;
    const modes = ['', 'pure-transparent', 'dark-mode'];
    function cycleTransparency() {
      modeIdx = (modeIdx + 1) % modes.length;
      body.className = modes[modeIdx];
    }
    body.addEventListener('click', cycleTransparency);
    body.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        cycleTransparency();
      }
    });

    function handleUpdate(data) {
      if (!data) return;
      if (data.type === 'UPDATE_SUBTITLE') {
        const { sourceText, viText, subMode } = data;
        floatSource.textContent = sourceText || '';
        floatVi.textContent = viText || '';

        if (subMode === 'vi_only') {
          floatSource.style.display = 'none';
          floatVi.style.display = 'block';
        } else if (subMode === 'source_only' || subMode === 'en_only') {
          floatSource.style.display = 'block';
          floatVi.style.display = 'none';
        } else if (subMode === 'none') {
          floatSource.style.display = 'none';
          floatVi.style.display = 'none';
        } else {
          floatSource.style.display = sourceText ? 'block' : 'none';
          floatVi.style.display = 'block';
        }
      } else if (data.type === 'SET_TRANSPARENCY') {
        if (data.mode === 'transparent') {
          body.className = 'pure-transparent';
        } else if (data.mode === 'glass') {
          body.className = '';
        } else {
          body.className = 'dark-mode';
        }
      }
    }

    window.addEventListener('message', (e) => handleUpdate(e.data));

    try {
      const channel = new BroadcastChannel('livesub_overlay_channel');
      channel.onmessage = (e) => handleUpdate(e.data);
    } catch (e) {
      console.warn('BroadcastChannel error:', e);
    }
  </script>
</body>
</html>
